name: Build & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Release publish karo (version.json ke hisaab se tag v<version>)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — Detect release step needs HEAD^ (shallow clone me git diff HEAD^ HEAD fail hota hai)

      - name: Parse version.json
        id: version
        run: |
          VERSION_NAME=$(python3 -c "import json; print(json.load(open('version.json')).get('version_name', '1.0.0'))")
          VERSION_CODE=$(python3 -c "import json; print(json.load(open('version.json')).get('version_code', 1))")
          CHANGELOG=$(python3 -c "import json; cl = json.load(open('version.json')).get('changelog', ''); print('\n'.join(cl) if isinstance(cl, list) else cl)")
          echo "tag=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "name=v${VERSION_NAME} (code ${VERSION_CODE})" >> $GITHUB_OUTPUT
          echo "version=${VERSION_NAME}" >> $GITHUB_OUTPUT
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # Release sirf tab: version.json ka tag abhi tak published NAHI hai
      # (pehle HEAD^ diff se hota tha — failed build ke baad agli green push par
      #  release fir se publish nahi hoti thi; ab tag-compare se ye problem gayi)
      - name: Detect release
        id: release
        run: |
          DO_RELEASE="false"
          CURRENT_TAG="v$(python3 -c "import json; print(json.load(open('version.json')).get('version_name','1.0.0'))")"
          if ! git ls-remote --tags origin "refs/tags/$CURRENT_TAG" | grep -q "refs/tags/$CURRENT_TAG$"; then
            DO_RELEASE="true"
          fi
          echo "do=$DO_RELEASE" >> $GITHUB_OUTPUT
          echo "Release mode: $DO_RELEASE (tag: $CURRENT_TAG)"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go (agy_ide_bridge build ke liye)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node 20 (Creator Studio build ke liye)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Gradle (cache ke saath)
        uses: gradle/actions/setup-gradle@v4

      - name: Build Creator Studio (Next.js standalone)
        working-directory: creator-studio
        run: |
          npm ci
          npm run build
          test -f .next/standalone/server.js || { echo "standalone build nahi hua"; exit 1; }
          test -d .next/standalone/data/creator-studio/packages || echo "WARNING: default skill library standalone me trace nahi hui"

      - name: Bundle Creator Studio into APK assets
        run: |
          mkdir -p app/src/main/assets
          cd creator-studio
          zip -qr ../app/src/main/assets/creator-studio.zip .next/standalone
          cd ..
          ls -lh app/src/main/assets/creator-studio.zip

      - name: Restore Keystore from Secret
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Error: RELEASE_KEYSTORE_BASE64 secret missing. Repo Settings > Secrets me add karo."
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Build Release APK (termux flavor — com.termux.creatorstudio, termux bootstrap env)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleTermuxRelease --no-daemon --stacktrace

      - name: Prepare release APK name (updater pattern)
        run: |
          mkdir -p output
          VERSION="${{ steps.version.outputs.version }}"
          SRC=$(find app/build/outputs/apk/termux/release -name "*.apk" | head -1)
          test -n "$SRC" || { echo "APK nahi mila"; exit 1; }
          cp "$SRC" "output/CreatorStudio-termux-v${VERSION}-release.apk"
          ls -lh output/

      - name: Upload APK artifact (har push par)
        uses: actions/upload-artifact@v4
        with:
          name: CreatorStudio-termux-v${{ steps.version.outputs.version }}
          path: output/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (version.json change par)
        if: steps.release.outputs.do == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: ${{ steps.version.outputs.changelog }}
          generate_release_notes: true
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
